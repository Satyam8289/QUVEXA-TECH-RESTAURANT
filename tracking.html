<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Track Order — The Food House</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f5132'/%3E%3Cpath d='M4 18c8 2 15-4 15-13 0 0-13-3-15 8' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body class="customer">
  <div class="phone">
    <div id="brand"></div>
    <div id="content"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    const STEPS = [
      { key: "pending",   title: "Order placed",   sub: "We’ve received your order" },
      { key: "preparing", title: "Preparing",      sub: "The kitchen is cooking your food" },
      { key: "ready",     title: "Ready to serve", sub: "Freshly prepared and plated" },
      { key: "served",    title: "Served",         sub: "Enjoy your meal!" },
    ];
    const ORDER_OF = { pending: 0, preparing: 1, ready: 2, served: 3 };
    const code = new URLSearchParams(location.search).get("id") || localStorage.getItem("foodhouse-lastOrder");
    let lastStatus = null;

    async function render() {
      const content = document.getElementById("content");
      if (!code) {
        content.innerHTML = `<div class="empty">${App.icon("clock",44)}<h3>No active order</h3><p>Place an order to track it live here.</p><a class="btn" style="margin-top:16px" href="menu.html">Browse Menu</a></div>`;
        return;
      }
      let order;
      try { order = await Api.getOrderByCode(code); }
      catch (e) {
        content.innerHTML = `<div class="empty">${App.icon("clock",44)}<h3>Order not found</h3><p>${e.message}</p><a class="btn" style="margin-top:16px" href="menu.html">Browse Menu</a></div>`;
        return;
      }
      // The 4s poll only needs to redraw when something actually changed —
      // otherwise it would wipe out a half-typed feedback comment.
      if (order.status === lastStatus) return;
      lastStatus = order.status;
      const cur = ORDER_OF[order.status];

      content.innerHTML = `
        <div class="section" style="padding-bottom:6px">
          <div class="card" style="padding:18px;display:flex;align-items:center;gap:14px">
            <div>
              <div style="font-size:12px;color:var(--muted)">Order</div>
              <div style="font-family:var(--serif);font-size:20px;font-weight:600">${order.code}</div>
            </div>
            <span class="badge ${order.status}" style="margin-left:auto">${order.status}</span>
          </div>
        </div>

        <div class="section" style="padding-top:8px">
          <div class="card timeline">
            ${STEPS.map((s, i) => {
              const cls = i < cur ? "done" : i === cur ? "current" : "";
              const knob = i < cur ? App.icon("check", 18) : (i + 1);
              return `<div class="tl-step ${cls}">
                <div class="tl-dot"><span class="knob">${knob}</span><span class="bar"></span></div>
                <div class="tl-body"><b>${s.title}</b><small>${s.sub}</small></div>
              </div>`;
            }).join("")}
          </div>
        </div>

        <div class="section" style="padding-top:0">
          <div class="card" style="padding:16px">
            <div style="font-weight:700;margin-bottom:10px">Order summary · ${order.orderType === "takeaway" ? `Takeaway${order.vehicleNumber ? ` · ${order.vehicleNumber}` : ""}` : `Table ${order.table ?? "—"}`}</div>
            ${order.items.map(it => `<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:14px"><span>${it.qty} × ${it.name}</span><span>${App.money(it.price * it.qty)}</span></div>`).join("")}
            <div style="display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1px dashed var(--line);font-weight:700"><span>Total</span><span>${App.money(order.total)}</span></div>
          </div>
        </div>

        <div class="section" id="feedbackSlot" style="padding-top:0"></div>

        <div class="section" style="padding-top:0">
          <div style="display:flex;gap:10px">
            <a class="btn btn-ghost btn-block" href="bill.html?code=${encodeURIComponent(order.code)}&r=${Api.tenantSlug()}">${App.icon("clipboard",16)} Bill</a>
            <a class="btn btn-wa btn-block" target="_blank" rel="noopener" href="${App.whatsappOrderLink(order)}">${App.icon("whatsapp",18)} WhatsApp</a>
          </div>
          <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:12px">Status updates automatically as the kitchen progresses. You can also collect it from reception.</p>
        </div>`;

      // Dine-in ends at "served". A takeaway customer collects the order the
      // moment it's ready and walks off, so waiting for "served" would mean
      // they're never asked to rate it.
      const canRate = order.status === "served" || (order.orderType === "takeaway" && order.status === "ready");
      if (canRate) renderFeedback(order);
    }

    /* Private rating — goes only to the restaurant. Once it's in, happy
       customers get the option to also post publicly on Google; we can never
       post on their behalf (Google forbids it), they tap through themselves. */
    const ratedKey = (code) => `foodhouse-rated:${code}`;
    let chosenRating = 0;

    function renderFeedback(order) {
      const slot = document.getElementById("feedbackSlot");
      if (!slot) return;
      if (localStorage.getItem(ratedKey(order.code))) { renderThanks(slot); return; }
      slot.innerHTML = `
        <div class="card" style="padding:18px">
          <b style="font-size:15px">How was your meal?</b>
          <p style="color:var(--muted);font-size:12.5px;margin:4px 0 14px">This goes straight to the restaurant — it isn't posted anywhere public.</p>
          <div id="stars" style="display:flex;gap:8px;margin-bottom:14px">
            ${[1,2,3,4,5].map(n => `<button type="button" class="star-btn" data-star="${n}" aria-label="${n} star">${App.icon("star",26)}</button>`).join("")}
          </div>
          <textarea class="input" id="fbComment" rows="2" placeholder="Anything we could do better? (optional)" style="resize:vertical"></textarea>
          <button class="btn btn-block" id="fbSend" style="margin-top:12px">Send feedback</button>
          <div id="fbMsg"></div>
        </div>`;
      slot.querySelectorAll("[data-star]").forEach((b) => b.addEventListener("click", () => {
        chosenRating = Number(b.dataset.star);
        slot.querySelectorAll("[data-star]").forEach((x) =>
          x.classList.toggle("on", Number(x.dataset.star) <= chosenRating));
      }));
      document.getElementById("fbSend").addEventListener("click", async () => {
        if (!chosenRating) { App.toast("Please pick a star rating"); return; }
        const btn = document.getElementById("fbSend");
        btn.disabled = true; btn.textContent = "Sending…";
        try {
          const res = await Api.submitFeedback(order.code, chosenRating, document.getElementById("fbComment").value);
          localStorage.setItem(ratedKey(order.code), String(chosenRating));
          renderThanks(slot, chosenRating, res.googleReviewUrl);
        } catch (e) {
          document.getElementById("fbMsg").innerHTML = `<p style="color:var(--danger);font-size:12.5px;margin-top:8px">${e.message}</p>`;
          btn.disabled = false; btn.textContent = "Send feedback";
        }
      });
    }

    function renderThanks(slot, rating, googleUrl) {
      const stars = rating || Number(localStorage.getItem(ratedKey(code))) || 0;
      slot.innerHTML = `
        <div class="card" style="padding:18px;text-align:center">
          <div style="color:var(--green-700)">${App.icon("check",30)}</div>
          <b style="font-size:15px;display:block;margin-top:4px">Thanks for the feedback!</b>
          <p style="color:var(--muted);font-size:12.5px;margin-top:4px">The restaurant has been notified.</p>
          ${stars >= 4 && googleUrl ? `<a class="btn btn-ghost btn-block" style="margin-top:14px" target="_blank" rel="noopener" href="${googleUrl}">${App.icon("star",16)} Share it on Google too</a>` : ""}
        </div>`;
    }

    async function main() {
      try { await Api.loadPublic(); } catch (e) { /* still try to render the order below */ }
      document.getElementById("brand").innerHTML = App.brandBar({ back: "menu.html", subtitle: "Live Tracking" });
      await render();
      App.mountBottomNav("orders");
      setInterval(render, 4000);   // reflect kitchen status changes live
    }
    main();
  </script>
</body>
</html>
