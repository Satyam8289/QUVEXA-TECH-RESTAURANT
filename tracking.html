<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Track Order — The Food House</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f5132'/%3E%3Cpath d='M4 18c8 2 15-4 15-13 0 0-13-3-15 8' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body class="customer">
  <div class="phone">
    <div id="brand"></div>
    <div id="notifyBanner"></div>
    <div id="content"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    const STEPS = [
      { key: "pending",   title: "Order placed",   sub: "We’ve received your order" },
      { key: "preparing", title: "Preparing",      sub: "The kitchen is cooking your food" },
      { key: "ready",     title: "Ready to serve", sub: "Freshly prepared and plated" },
      { key: "served",    title: "Served",         sub: "Enjoy your meal!" },
    ];
    const ORDER_OF = { pending: 0, preparing: 1, ready: 2, served: 3 };
    // What to tell the customer when their order reaches each stage — only
    // the stages worth interrupting them for (not the initial "placed").
    const NOTIFY_TEXT = {
      preparing: "The kitchen has started cooking your order.",
      ready:     "Your order is ready! 🎉",
      served:    "Enjoy your meal!",
    };
    let googleReviewUrl = "";
    const params = new URLSearchParams(location.search);
    const code = params.get("id") || localStorage.getItem("foodhouse-lastOrder");
    const token = params.get("t") || localStorage.getItem("foodhouse-lastOrderToken") || "";
    let lastStatus = null;

    /* Browser push notifications for order-status changes — free, no backend
       or Meta setup needed. On Android, `new Notification()` isn't available
       at all; it must go through a ServiceWorkerRegistration instead, so we
       register a (deliberately empty) service worker just to enable that. */
    let swRegistration = null;
    async function setupNotifications() {
      if (!("Notification" in window)) return; // unsupported browser — silently skip
      if ("serviceWorker" in navigator) {
        try { swRegistration = await navigator.serviceWorker.register("/sw.js"); } catch (e) { /* proceed without it */ }
      }
      if (Notification.permission === "default") renderNotifyBanner();
    }
    function renderNotifyBanner() {
      const el = document.getElementById("notifyBanner");
      el.innerHTML = `
        <div class="section" style="padding-bottom:0">
          <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px">
            <span style="color:var(--green-700)">${App.icon("alert", 20)}</span>
            <p style="flex:1;font-size:12.5px;margin:0">Get notified the moment your order is ready — even if you switch apps.</p>
            <button class="btn" id="notifyEnableBtn" style="padding:9px 14px;font-size:13px;white-space:nowrap">Enable</button>
          </div>
        </div>`;
      document.getElementById("notifyEnableBtn").addEventListener("click", async () => {
        const perm = await Notification.requestPermission();
        el.innerHTML = "";
        if (perm === "granted") App.toast("Notifications on — we'll let you know!");
      });
    }
    async function notify(title, body) {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      const opts = { body, tag: "order-status" }; // tag replaces any earlier notification instead of stacking
      if (swRegistration) { try { await swRegistration.showNotification(title, opts); return; } catch (e) { /* fall through */ } }
      try { new Notification(title, opts); } catch (e) { /* Android without a working SW — nothing more we can do */ }
    }

    async function render() {
      const content = document.getElementById("content");
      if (!code) {
        content.innerHTML = `<div class="empty">${App.icon("clock",44)}<h3>No active order</h3><p>Place an order to track it live here.</p><a class="btn" style="margin-top:16px" href="menu.html">Browse Menu</a></div>`;
        return;
      }
      let order;
      try { order = await Api.getOrderByCode(code, token); }
      catch (e) {
        content.innerHTML = `<div class="empty">${App.icon("clock",44)}<h3>Order not found</h3><p>${e.message}</p><a class="btn" style="margin-top:16px" href="menu.html">Browse Menu</a></div>`;
        return;
      }
      // The 4s poll only needs to redraw when something actually changed —
      // otherwise it would wipe out a half-typed feedback comment.
      if (order.status === lastStatus) return;
      // Only notify on a genuine transition (lastStatus !== null), never on
      // the very first load of an order that's already past "pending".
      if (lastStatus !== null && NOTIFY_TEXT[order.status]) notify(`Order ${order.code}`, NOTIFY_TEXT[order.status]);
      lastStatus = order.status;
      const cur = ORDER_OF[order.status];

      content.innerHTML = `
        <div class="section" style="padding-bottom:6px">
          <div class="card" style="padding:18px;display:flex;align-items:center;gap:14px">
            <div>
              <div style="font-size:12px;color:var(--muted)">Order</div>
              <div style="font-family:var(--serif);font-size:20px;font-weight:600">${order.code}</div>
            </div>
            <span class="badge ${order.status}" style="margin-left:auto">${order.status}</span>
          </div>
        </div>

        <div class="section" style="padding-top:8px">
          <div class="card timeline">
            ${STEPS.map((s, i) => {
              const cls = i < cur ? "done" : i === cur ? "current" : "";
              const knob = i < cur ? App.icon("check", 18) : (i + 1);
              return `<div class="tl-step ${cls}">
                <div class="tl-dot"><span class="knob">${knob}</span><span class="bar"></span></div>
                <div class="tl-body"><b>${s.title}</b><small>${s.sub}</small></div>
              </div>`;
            }).join("")}
          </div>
        </div>

        <div class="section" style="padding-top:0">
          <div class="card" style="padding:16px">
            <div style="font-weight:700;margin-bottom:10px">Order summary · ${order.orderType === "takeaway" ? `Takeaway${order.vehicleNumber ? ` · ${App.esc(order.vehicleNumber)}` : ""}` : `Table ${order.table ?? "—"}`}</div>
            ${order.items.map(it => `<div style="display:flex;justify-content:space-between;padding:5px 0;font-size:14px"><span>${it.qty} × ${App.esc(it.name)}</span><span>${App.money(it.price * it.qty)}</span></div>`).join("")}
            <div style="display:flex;justify-content:space-between;padding-top:10px;margin-top:6px;border-top:1px dashed var(--line);font-weight:700"><span>Total</span><span>${App.money(order.total)}</span></div>
          </div>
        </div>

        <div class="section" id="feedbackSlot" style="padding-top:0"></div>

        <div class="section" style="padding-top:0">
          <a class="btn btn-ghost btn-block" href="bill.html?code=${encodeURIComponent(order.code)}&t=${encodeURIComponent(order.token || token)}&r=${Api.tenantSlug()}">${App.icon("clipboard",16)} Bill</a>
          <p style="text-align:center;color:var(--muted);font-size:12px;margin-top:12px">Status updates automatically as the kitchen progresses. You can also collect it from reception.</p>
        </div>`;

      // Dine-in ends at "served". A takeaway customer collects the order the
      // moment it's ready and walks off, so waiting for "served" would mean
      // they're never asked to rate it.
      const canRate = order.status === "served" || (order.orderType === "takeaway" && order.status === "ready");
      if (canRate) renderFeedback();
    }

    /* One tap straight to the restaurant's Google review page — we can never
       post a review on the customer's behalf (Google forbids that), so the
       simplest honest thing is to just hand them the link. Only shown if the
       owner has actually set one in Settings. */
    function renderFeedback() {
      const slot = document.getElementById("feedbackSlot");
      if (!slot || !googleReviewUrl) return;
      slot.innerHTML = `
        <a class="btn btn-block" target="_blank" rel="noopener" href="${googleReviewUrl}">
          ${App.icon("star", 18)} Leave us a review
        </a>`;
    }

    async function main() {
      try { googleReviewUrl = (await Api.loadPublic()).tenant.googleReviewUrl || ""; } catch (e) { /* still try to render the order below */ }
      document.getElementById("brand").innerHTML = App.brandBar({ back: "menu.html", subtitle: "Live Tracking" });
      setupNotifications();
      await render();
      App.mountBottomNav("orders");
      setInterval(render, 4000);   // reflect kitchen status changes live
    }
    main();
  </script>
</body>
</html>
