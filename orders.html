<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>My Orders — The Food House</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f5132'/%3E%3Cpath d='M4 18c8 2 15-4 15-13 0 0-13-3-15 8' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body class="customer">
  <div class="phone">
    <div id="brand"></div>
    <div id="content"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    const content = document.getElementById("content");

    function phoneGateHTML(errorMsg) {
      const known = App.getCustomer();
      return `
        <div class="section" style="padding-top:36px">
          <div class="card" style="padding:24px;text-align:center">
            <div style="color:var(--green-700);margin-bottom:10px">${App.icon("clock",40)}</div>
            <h3 style="font-family:var(--serif);font-size:19px;margin-bottom:6px">Find your orders</h3>
            <p style="color:var(--muted);font-size:13.5px;margin-bottom:18px">Enter the phone number you ordered with — we'll show every order you've placed here, from any device.</p>
            <form id="phoneForm" style="text-align:left">
              <div class="field" style="margin-bottom:${errorMsg ? "8px" : "16px"}">
                <label for="lookupPhone">Phone number</label>
                <input class="input" id="lookupPhone" type="tel" inputmode="tel" required placeholder="+91 98765 43210" value="${known ? known.phone : ""}" />
              </div>
              ${errorMsg ? `<p style="color:var(--danger);font-size:12.5px;margin-bottom:16px">${errorMsg}</p>` : ""}
              <button class="btn btn-block btn-lg" type="submit">View my orders</button>
            </form>
          </div>
        </div>`;
    }

    async function showOrdersFor(phone) {
      content.innerHTML = `<div class="skeleton" style="padding:60px;text-align:center;color:var(--muted)">Looking up your orders…</div>`;
      try {
        const orders = await Api.myOrders(phone);
        renderList(orders, phone);
      } catch (e) {
        content.innerHTML = phoneGateHTML(e.message || "Couldn't look up that number. Please try again.");
        bindGate();
      }
    }

    function renderList(orders, phone) {
      if (!orders.length) {
        content.innerHTML = `<div class="empty">${App.icon("clock",44)}<h3>No orders found</h3><p>No orders yet for ${phone}.</p>
          <a class="btn" style="margin-top:18px" href="menu.html">Browse Menu</a>
          <button class="btn btn-ghost" id="changeNo" style="margin-top:10px">Try a different number</button></div>`;
        document.getElementById("changeNo").addEventListener("click", () => { content.innerHTML = phoneGateHTML(); bindGate(); });
        return;
      }
      content.innerHTML = `
        <div class="section" style="padding-bottom:8px;display:flex;align-items:center;gap:10px">
          <span style="font-size:13px;color:var(--muted)">${orders.length} order${orders.length > 1 ? "s" : ""} for <b style="color:var(--ink)">${phone}</b></span>
          <button class="chip" id="changeNo" style="margin-left:auto;border:none;cursor:pointer">Change number</button>
        </div>
        <div class="section" style="padding-top:0">
          <div class="stack">${orders.map(cardHTML).join("")}</div>
        </div>`;
      document.getElementById("changeNo").addEventListener("click", () => { content.innerHTML = phoneGateHTML(); bindGate(); });
    }

    function cardHTML(o) {
      const items = o.items.map((i) => `${i.qty}× ${i.name}`).join(" · ");
      return `
      <a class="card" href="tracking.html?id=${encodeURIComponent(o.code)}&t=${encodeURIComponent(o.token || "")}" style="display:block;padding:16px">
        <div style="display:flex;align-items:center;gap:10px">
          <div>
            <div style="font-family:var(--serif);font-size:17px;font-weight:600">${o.code}</div>
            <div style="font-size:12px;color:var(--muted)">Table ${o.table ?? "—"} · ${App.timeAgo(o.createdAt)} · ${o.method}</div>
          </div>
          <span class="badge ${o.status}" style="margin-left:auto">${o.status}</span>
        </div>
        <div style="font-size:13px;color:var(--muted);margin:10px 0;line-height:1.4">${items}</div>
        <div style="display:flex;align-items:center;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--line)">
          <span style="font-weight:700">${App.money(o.total)}</span>
          <span style="color:var(--green-700);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px">Track ${App.icon("back",14,"flip")}</span>
        </div>
      </a>`;
    }

    function bindGate() {
      document.querySelectorAll(".flip").forEach((s) => s.style.transform = "rotate(180deg)");
      document.getElementById("phoneForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const phone = document.getElementById("lookupPhone").value.trim();
        if (phone.replace(/\D/g, "").length < 6) { content.innerHTML = phoneGateHTML("Enter a valid phone number"); bindGate(); return; }
        showOrdersFor(phone);
      });
    }

    async function main() {
      try { await Api.loadPublic(); } catch (e) { /* still allow phone lookup which will surface its own error */ }
      document.getElementById("brand").innerHTML = App.brandBar({ back: "menu.html", subtitle: "My Orders", orders: false });
      App.mountBottomNav("orders");
      const known = App.getCustomer();
      if (known && known.phone) showOrdersFor(known.phone);
      else { content.innerHTML = phoneGateHTML(); bindGate(); }
    }
    main();
  </script>
</body>
</html>
