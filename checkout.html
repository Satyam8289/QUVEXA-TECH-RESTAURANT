<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Checkout — The Food House</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f5132'/%3E%3Cpath d='M4 18c8 2 15-4 15-13 0 0-13-3-15 8' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body class="customer">
  <div class="phone">
    <div id="brand"></div>

    <form id="checkoutForm">
      <div class="section" style="padding-bottom:6px">
        <div class="card" style="padding:18px">
          <div class="field">
            <label for="name">Your name</label>
            <input class="input" id="name" required placeholder="e.g. Ananya" />
          </div>
          <div class="field">
            <label for="phone">Phone number (for WhatsApp updates)</label>
            <input class="input" id="phone" type="tel" required inputmode="tel" placeholder="+91 98765 43210" />
          </div>
          <div class="field" style="margin-bottom:0" id="tableField">
            <label for="table">Table number</label>
            <input class="input" id="table" type="number" min="1" max="12" required placeholder="e.g. 4" />
          </div>
          <div class="field" style="margin-bottom:0;display:none" id="vehicleField">
            <label for="vehicle">Vehicle number</label>
            <input class="input" id="vehicle" placeholder="e.g. MH 12 AB 3456" autocomplete="off" style="text-transform:uppercase" />
          </div>
        </div>
      </div>

      <div class="section" style="padding-top:10px;padding-bottom:6px">
        <label style="font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:10px">Payment method</label>
        <div class="pay-methods" id="payMethods"></div>
      </div>

      <div class="section" style="padding-top:10px;padding-bottom:0" id="loyaltyNote"></div>

      <div class="section" style="padding-top:10px">
        <div class="card summary" id="summary"></div>
      </div>
      <div style="height:20px"></div>
    </form>
  </div>

  <div class="docked" id="dock"></div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    // Loaded lazily (only when the restaurant has Razorpay connected and the
    // customer actually picks "Pay Online") so pages that never use it don't
    // pay for an extra external script.
    function loadRazorpayScript() {
      return new Promise((resolve, reject) => {
        if (window.Razorpay) return resolve();
        const s = document.createElement("script");
        s.src = "https://checkout.razorpay.com/v1/checkout.js";
        s.onload = resolve;
        s.onerror = () => reject(new Error("Could not load the payment gateway. Check your connection and try again."));
        document.head.appendChild(s);
      });
    }
  </script>
  <script>
    if (!Cart.all().length) location.href = "menu.html";

    // Prefill from the identity captured on the menu page.
    const known = App.getCustomer();
    if (known) { document.getElementById("name").value = known.name; document.getElementById("phone").value = known.phone; }

    let method = "Online";
    let razorpayEnabled = false;
    // Takeaway (and car service) is prepaid — Cash isn't an option there,
    // because there's no waiter to collect it from someone who isn't seated.
    const TAKEAWAY = App.isTakeaway();
    document.getElementById("payMethods").innerHTML = TAKEAWAY
      ? `<button type="button" class="pay active" data-pay="Online" style="grid-column:1/-1"><span class="pay-ico">${App.icon("card", 17)}</span>Card / UPI — pay now</button>`
      : `<button type="button" class="pay" data-pay="Cash"><span class="pay-ico">${App.icon("rupee", 17)}</span>Cash</button>
         <button type="button" class="pay active" data-pay="Online"><span class="pay-ico">${App.icon("card", 17)}</span>Card / UPI</button>`;

    const vehicleInput = document.getElementById("vehicle");
    if (TAKEAWAY) {
      document.getElementById("tableField").style.display = "none";
      document.getElementById("table").required = false;
      document.getElementById("vehicleField").style.display = "";
      vehicleInput.required = true;
      vehicleInput.value = App.getVehicle();
    }
    const tableField = document.getElementById("table");
    tableField.value = App.getTableNo();
    // If the table came from scanning its QR, lock it so it can't be changed.
    if (App.isTableLocked() && App.getTableNo()) {
      tableField.readOnly = true;
      tableField.style.background = "var(--green-50)";
    }

    document.querySelectorAll(".pay").forEach(p =>
      p.addEventListener("click", () => {
        document.querySelectorAll(".pay").forEach(x => x.classList.remove("active"));
        p.classList.add("active");
        method = p.dataset.pay;
      }));

    const sub = () => Cart.subtotal();
    const gst = () => Math.round(sub() * 0.05);
    const service = () => Math.round(sub() * 0.03);
    let loyaltyDiscount = 0;   // filled in by refreshLoyalty() once we know the phone
    const total = () => Math.max(0, sub() + gst() + service() - loyaltyDiscount);

    /* Loyalty reward preview. The server decides whether this order actually
       earns one (and recomputes it at order time) — we only display it. */
    async function refreshLoyalty() {
      const phone = document.getElementById("phone").value.trim();
      let info = null;
      try { info = await Api.loyaltyStatus(phone, sub()); } catch (e) { /* non-critical */ }
      loyaltyDiscount = (info && info.discount) || 0;
      const note = document.getElementById("loyaltyNote");
      if (info && info.enabled && !loyaltyDiscount && info.ordersUntilReward > 0 && phone) {
        note.innerHTML = `<div class="card" style="padding:12px 14px;font-size:13px;display:flex;align-items:center;gap:9px">
          ${App.icon("star", 16)}<span><b>${info.ordersUntilReward}</b> more order${info.ordersUntilReward === 1 ? "" : "s"} and you unlock <b>${info.percent}% off</b>.</span></div>`;
      } else note.innerHTML = "";
      renderSummary();
    }

    function renderSummary() {
      document.getElementById("summary").innerHTML = `
        <div class="row"><span>Subtotal</span><span>${App.money(sub())}</span></div>
        <div class="row"><span>GST (5%)</span><span>${App.money(gst())}</span></div>
        <div class="row"><span>Service charge</span><span>${App.money(service())}</span></div>
        ${loyaltyDiscount ? `<div class="row" style="color:var(--green-700);font-weight:600"><span>${App.icon("star",14)} Loyalty reward</span><span>− ${App.money(loyaltyDiscount)}</span></div>` : ""}
        <div class="row total"><span>Total payable</span><span>${App.money(total())}</span></div>`;
      const btn = document.querySelector("#dock button");
      if (btn && !btn.disabled) btn.textContent = `Place Order · ${App.money(total())}`;
    }

    let tenantName = "";
    async function main() {
      let closed = false;
      try {
        const data = await Api.loadPublic();
        closed = !!data.tenant.isClosed;
        tenantName = data.tenant.name;
        razorpayEnabled = !!data.tenant.razorpayEnabled;
      } catch (e) { /* keep going, backend errors surface on submit */ }
      document.getElementById("brand").innerHTML = App.brandBar({ back: "cart.html", subtitle: "Checkout" });
      if (closed) {
        document.getElementById("checkoutForm").innerHTML = `<div class="empty">${App.icon("lock",44)}<h3>Store is closed</h3><p>This restaurant isn't accepting new orders right now. Please try again later.</p><a class="btn" style="margin-top:16px" href="menu.html">Back to menu</a></div>`;
        document.getElementById("dock").innerHTML = "";
        return;
      }
      document.getElementById("dock").innerHTML =
        `<button class="btn btn-block btn-lg" type="submit" form="checkoutForm">Place Order · ${App.money(total())}</button>`;
      renderSummary();
      refreshLoyalty();
      // Re-check whenever they finish editing the phone — that's the key the
      // loyalty count is tracked against.
      document.getElementById("phone").addEventListener("change", refreshLoyalty);
    }
    main();

    document.getElementById("checkoutForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const table = document.getElementById("table").value.trim();
      const vehicle = vehicleInput.value.trim().toUpperCase();
      if (!name || !phone) { App.toast("Please fill all fields"); return; }
      if (TAKEAWAY && !vehicle) { App.toast("Please enter your vehicle number"); return; }
      if (!TAKEAWAY && !table) { App.toast("Please enter your table number"); return; }
      if (TAKEAWAY) App.setVehicle(vehicle); else App.setTableNo(table);
      App.setCustomer({ name, phone });

      const items = Cart.all().map(l => ({ id: l.id, name: l.name, qty: l.qty, price: l.price, note: l.note || "" }));
      const submitBtn = document.querySelector('#dock button');
      const resetBtn = () => { submitBtn.disabled = false; submitBtn.textContent = `Place Order · ${App.money(total())}`; };

      if (method === "Online" && razorpayEnabled) {
        submitBtn.disabled = true; submitBtn.textContent = "Starting payment…";
        try {
          await loadRazorpayScript();
          const rzp = await Api.razorpayCreateOrder(items, phone);
          const checkout = new Razorpay({
            key: rzp.keyId,
            order_id: rzp.razorpayOrderId,
            amount: rzp.amount,
            currency: rzp.currency,
            name: tenantName,
            description: TAKEAWAY ? `Takeaway · ${vehicle}` : `Table ${table}`,
            prefill: { name, contact: phone },
            theme: { color: "#0f5132" },
            handler: async (resp) => {
              submitBtn.textContent = "Confirming payment…";
              try {
                const order = await Api.razorpayVerifyAndPlaceOrder({
                  razorpay_order_id: resp.razorpay_order_id,
                  razorpay_payment_id: resp.razorpay_payment_id,
                  razorpay_signature: resp.razorpay_signature,
                  table: TAKEAWAY ? null : Number(table), customer: name, phone, items,
                  orderType: TAKEAWAY ? "takeaway" : "dine-in", vehicleNumber: vehicle,
                });
                localStorage.setItem("foodhouse-lastOrder", order.code);
                Cart.clear();
                location.href = "thankyou.html";
              } catch (ex) {
                App.toast(ex.message || "Payment succeeded but we couldn't confirm your order. Please contact the restaurant.");
                resetBtn();
              }
            },
            modal: { ondismiss: () => { App.toast("Payment cancelled"); resetBtn(); } },
          });
          checkout.on("payment.failed", () => { App.toast("Payment failed. Please try again."); resetBtn(); });
          checkout.open();
        } catch (ex) {
          App.toast(ex.message || "Couldn't start payment. Please try again.");
          resetBtn();
        }
        return;
      }

      // Takeaway can only be prepaid, so it must never reach this pay-later
      // path — the server rejects it too, but fail clearly here first.
      if (TAKEAWAY) { App.toast("Takeaway orders must be paid online. Please try again."); resetBtn(); return; }

      // Fallback for restaurants that haven't connected Razorpay yet: treat
      // Card/UPI like the counter handles it today — collected on the spot.
      const orderMethod = method === "Online" ? "Card/UPI" : method;
      submitBtn.disabled = true; submitBtn.textContent = "Placing order…";
      try {
        const order = await Api.placeOrderPublic({ table: Number(table), customer: name, phone, method: orderMethod, items, orderType: "dine-in" });
        localStorage.setItem("foodhouse-lastOrder", order.code);
        Cart.clear();
        location.href = "thankyou.html";
      } catch (ex) {
        App.toast(ex.message || "Couldn't place your order. Please try again.");
        resetBtn();
      }
    });
  </script>
</body>
</html>
