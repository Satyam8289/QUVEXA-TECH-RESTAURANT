<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Editor — Restaurant Admin</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f5132'/%3E%3Cpath d='M4 18c8 2 15-4 15-13 0 0-13-3-15 8' fill='%23fff'/%3E%3C/svg%3E" />
  <style>
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-grid .full { grid-column:1 / -1; }
    .veg-choice { display:flex; gap:10px; }
    .veg-choice button { flex:1; padding:11px; border-radius:12px; border:1.5px solid var(--line); background:var(--white); font-weight:600; font-size:13px; }
    .veg-choice button.active { border-color:var(--green-600); background:var(--green-50); color:var(--green-800); }
    @media (max-width:560px){ .form-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="dash-main">
      <nav class="mobile-nav" id="mobileNav"></nav>
      <div class="dash-head" id="topbar"></div>
      <div id="view"><div class="skeleton" style="padding:80px;text-align:center;color:var(--muted)">Loading…</div></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-back" id="modalBack">
    <form class="modal card" id="itemForm" style="max-width:520px">
      <h3 id="modalTitle">Add dish</h3>
      <input type="hidden" id="f-id" />
      <div class="form-grid">
        <div class="field full"><label>Name</label><input class="input" id="f-name" required placeholder="e.g. Paneer Tikka" /></div>
        <div class="field full"><label>Description</label><input class="input" id="f-desc" placeholder="Short description" /></div>
        <div class="field"><label>Price (₹)</label><input class="input" id="f-price" type="number" min="0" required /></div>
        <div class="field"><label>Stock</label><input class="input" id="f-stock" type="number" min="0" required /></div>
        <div class="field"><label>Category</label><select class="input" id="f-cat"></select></div>
        <div class="field"><label>Rating</label><input class="input" id="f-rating" type="number" min="0" max="5" step="0.1" value="4.5" /></div>
        <div class="field full">
          <label>Photo</label>
          <div class="logo-uploader" style="margin-bottom:10px">
            <div class="logo-preview" id="dishPreview" style="width:56px;height:56px"></div>
            <div>
              <label class="upload-btn">Upload photo<input type="file" id="dishImageInput" accept="image/*" hidden></label>
              <div class="settings-hint">Or paste an image URL below · under 1.5 MB.</div>
            </div>
          </div>
          <input class="input" id="f-image" placeholder="https://…  (leave blank for a branded placeholder)" />
        </div>
        <div class="field full"><label>Type</label>
          <div class="veg-choice">
            <button type="button" data-veg="true" class="active">🟢 Veg</button>
            <button type="button" data-veg="false">🔴 Non-veg</button>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="cancelBtn" style="flex:1">Cancel</button>
        <button type="submit" class="btn" style="flex:1">Save dish</button>
      </div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    let CATS = [], MENU = [];
    const catName = (slug) => (CATS.find((c) => c.slug === slug) || {}).name || slug;

    let vegChoice = true;
    document.querySelectorAll(".veg-choice button").forEach((b) =>
      b.addEventListener("click", () => {
        document.querySelectorAll(".veg-choice button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        vegChoice = b.dataset.veg === "true";
      }));

    function renderGrid() {
      const nCats = new Set(MENU.map((m) => m.category)).size;
      document.getElementById("view").innerHTML = `
        <div class="view-head">
          <p>${MENU.length} items across ${nCats} categories</p>
          <div class="actions"><button class="btn" id="addBtn">+ Add menu item</button></div>
        </div>
        <div class="menu-grid">${MENU.map(cardHTML).join("")}</div>`;
      document.getElementById("addBtn").addEventListener("click", () => openModal(null));
      bind();
    }

    function cardHTML(m) {
      const low = m.stock <= 10;
      return `<div class="card menu-card">
        <img class="mc-img" src="${m.image}" alt="${m.name}" onerror="App.imgFallback(this)" />
        <div class="mc-body">
          <div class="mc-meta">
            <span class="mc-cat">${catName(m.category)}</span>
            <span class="mc-stock ${low ? "low" : ""}">${m.stock} in stock</span>
          </div>
          <h4>${m.name}</h4>
          <p>${m.description || ""}</p>
          <div class="mc-foot">
            <b>${App.money(m.price)}</b>
            <div style="display:flex;gap:14px;align-items:center">
              <a class="mc-edit" href="#" data-edit="${m.id}">${App.icon("dashboard",14)} Edit</a>
              <a class="mc-edit" href="#" data-del="${m.id}" style="color:var(--danger)">${App.icon("minus",14)} Delete</a>
            </div>
          </div>
        </div>
      </div>`;
    }

    function bind() {
      document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); openModal(b.dataset.edit); }));
      document.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async (e) => {
        e.preventDefault();
        const item = MENU.find((m) => m.id === b.dataset.del);
        if (confirm(`Delete "${item.name}" from the menu?`)) {
          await Api.deleteMenuItem(b.dataset.del);
          MENU = MENU.filter((m) => m.id !== item.id);
          App.toast("Dish deleted"); renderGrid();
        }
      }));
    }

    const modal = document.getElementById("modalBack");
    const dishPreview = document.getElementById("dishPreview");
    let pendingDishImage = null; // data URL staged for upload, or null = use the URL field as-is

    function renderDishPreview(url) {
      dishPreview.innerHTML = url ? `<img src="${url}" alt="preview" onerror="App.imgFallback(this)"/>` : App.icon("cutlery", 22);
    }
    document.getElementById("dishImageInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 1.5 * 1024 * 1024) { App.toast("Please use an image under 1.5 MB"); return; }
      const reader = new FileReader();
      reader.onload = () => {
        pendingDishImage = reader.result;
        document.getElementById("f-image").value = "";
        renderDishPreview(pendingDishImage);
      };
      reader.readAsDataURL(file);
    });
    document.getElementById("f-image").addEventListener("input", (e) => {
      pendingDishImage = null; // typing a URL overrides any staged upload
      renderDishPreview(e.target.value.trim());
    });

    function openModal(id) {
      const m = id ? MENU.find((x) => x.id === id) : null;
      document.getElementById("modalTitle").textContent = m ? "Edit dish" : "Add dish";
      document.getElementById("f-id").value = m ? m.id : "";
      document.getElementById("f-name").value = m ? m.name : "";
      document.getElementById("f-desc").value = m ? (m.description || "") : "";
      document.getElementById("f-price").value = m ? m.price : "";
      document.getElementById("f-stock").value = m ? m.stock : "";
      document.getElementById("f-cat").value = m ? m.category : (CATS[0] && CATS[0].slug);
      document.getElementById("f-rating").value = m ? (m.rating || 4.5) : 4.5;
      document.getElementById("f-image").value = m ? (m.image || "") : "";
      pendingDishImage = null;
      renderDishPreview(m ? m.image : "");
      vegChoice = m ? !!m.veg : true;
      document.querySelectorAll(".veg-choice button").forEach((x) => x.classList.toggle("active", (x.dataset.veg === "true") === vegChoice));
      modal.classList.add("open");
    }
    function closeModal() { modal.classList.remove("open"); }
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

    const PLACEHOLDER = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=70";
    document.getElementById("itemForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const id = document.getElementById("f-id").value || undefined;

      let image = document.getElementById("f-image").value.trim();
      if (pendingDishImage) {
        submitBtn.disabled = true; submitBtn.textContent = "Uploading photo…";
        try {
          const res = await Api.uploadImage(pendingDishImage, "menu");
          image = res.url;
        } catch (ex) {
          if (ex.message === "R2_NOT_CONFIGURED") image = pendingDishImage; // local dev fallback
          else { App.toast(ex.message || "Photo upload failed"); submitBtn.disabled = false; submitBtn.textContent = "Save dish"; return; }
        }
        submitBtn.textContent = "Save dish";
      }

      const item = {
        id,
        name: document.getElementById("f-name").value.trim(),
        description: document.getElementById("f-desc").value.trim(),
        price: Number(document.getElementById("f-price").value),
        stock: Number(document.getElementById("f-stock").value),
        category: document.getElementById("f-cat").value,
        rating: Number(document.getElementById("f-rating").value) || 4.5,
        image: image || PLACEHOLDER,
        veg: vegChoice,
      };
      if (!item.name) { App.toast("Name is required"); submitBtn.disabled = false; return; }
      try {
        const res = await Api.saveMenuItem(item);
        if (id) { const idx = MENU.findIndex((m) => m.id === id); MENU[idx] = { ...MENU[idx], ...item }; }
        else MENU.push({ ...item, id: res.id });
        App.toast(id ? "Dish updated" : "Dish added");
        closeModal();
        renderGrid();
      } catch (ex) { App.toast(ex.message); }
      submitBtn.disabled = false;
    });

    async function main() {
      const authData = await Api.requireAuth(["owner", "manager"]);
      if (!authData) return;
      App.mountSidebar("sidebar", "menu");
      App.mountMobileNav("mobileNav", "menu");
      App.mountTopbar("topbar", "Menu", async () => { [CATS, MENU] = await Promise.all([Api.getCategories(), Api.getMenu()]); renderGrid(); App.toast("Refreshed"); });
      [CATS, MENU] = await Promise.all([Api.getCategories(), Api.getMenu()]);
      document.getElementById("f-cat").innerHTML = CATS.map((c) => `<option value="${c.slug}">${c.name}</option>`).join("");
      renderGrid();
    }
    main();
  </script>
</body>
</html>
