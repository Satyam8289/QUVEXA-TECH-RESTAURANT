<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Menu Editor — Restaurant Admin</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f5132'/%3E%3Cpath d='M4 18c8 2 15-4 15-13 0 0-13-3-15 8' fill='%23fff'/%3E%3C/svg%3E" />
  <style>
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    .form-grid .full { grid-column:1 / -1; }
    .veg-choice { display:flex; gap:10px; }
    .veg-choice button { flex:1; padding:11px; border-radius:12px; border:1.5px solid var(--line); background:var(--white); font-weight:600; font-size:13px; }
    .veg-choice button.active { border-color:var(--green-600); background:var(--green-50); color:var(--green-800); }
    @media (max-width:560px){ .form-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="dash">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="dash-main">
      <nav class="mobile-nav" id="mobileNav"></nav>
      <div class="dash-head" id="topbar"></div>
      <div id="view"><div class="skeleton" style="padding:80px;text-align:center;color:var(--muted)">Loading…</div></div>
    </main>
  </div>

  <!-- Modal -->
  <div class="modal-back" id="modalBack">
    <form class="modal card" id="itemForm" style="max-width:520px">
      <h3 id="modalTitle">Add dish</h3>
      <input type="hidden" id="f-id" />
      <div class="form-grid">
        <div class="field full"><label>Name</label><input class="input" id="f-name" required placeholder="e.g. Paneer Tikka" /></div>
        <div class="field full"><label>Description</label><input class="input" id="f-desc" placeholder="Short description" /></div>
        <div class="field"><label>Price (₹)</label><input class="input" id="f-price" type="number" min="0" required /></div>
        <div class="field"><label>Stock</label><input class="input" id="f-stock" type="number" min="0" required /></div>
        <div class="field"><label>Category</label><select class="input" id="f-cat"></select></div>
        <div class="field"><label>Rating</label><input class="input" id="f-rating" type="number" min="0" max="5" step="0.1" value="4.5" /></div>
        <div class="field full">
          <label>Photo</label>
          <div class="logo-uploader" style="margin-bottom:10px">
            <div class="logo-preview" id="dishPreview" style="width:56px;height:56px"></div>
            <div>
              <label class="upload-btn">Upload photo<input type="file" id="dishImageInput" accept="image/*" hidden></label>
              <div class="settings-hint">Or paste an image URL below · under 1.5 MB.</div>
            </div>
          </div>
          <input class="input" id="f-image" placeholder="https://…  (leave blank for a branded placeholder)" />
        </div>
        <div class="field full"><label>Type</label>
          <div class="veg-choice">
            <button type="button" data-veg="true" class="active">🟢 Veg</button>
            <button type="button" data-veg="false">🔴 Non-veg</button>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="cancelBtn" style="flex:1">Cancel</button>
        <button type="submit" class="btn" style="flex:1">Save dish</button>
      </div>
    </form>
  </div>

  <!-- Combo modal: pick existing dishes, set a bundle price -->
  <div class="modal-back" id="comboBack">
    <form class="modal card" id="comboForm" style="max-width:560px">
      <h3>Add a combo</h3>
      <p class="settings-hint" style="margin:-6px 0 16px">Bundle dishes at a set price. Ordering a combo deducts stock from each dish inside it.</p>
      <div class="form-grid">
        <div class="field full"><label>Combo name</label><input class="input" id="c-name" required placeholder="e.g. Veg Thali Combo" /></div>
        <div class="field"><label>Combo price (₹)</label><input class="input" id="c-price" type="number" min="0" required /></div>
        <div class="field"><label>Category</label><select class="input" id="c-cat"></select></div>
        <div class="field full"><label>Photo URL (optional)</label><input class="input" id="c-image" placeholder="https://…" /></div>
      </div>
      <label style="font-size:13px;font-weight:600;color:var(--muted);display:block;margin:6px 0 8px">Dishes in this combo</label>
      <div id="comboPicker" style="max-height:230px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;padding:6px"></div>
      <div id="comboSummary" class="settings-hint" style="margin-top:10px"></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="comboCancel" style="flex:1">Cancel</button>
        <button type="submit" class="btn" style="flex:1">Save combo</button>
      </div>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    let CATS = [], MENU = [], COMBOS = [];
    const catName = (slug) => (CATS.find((c) => c.slug === slug) || {}).name || slug;

    let vegChoice = true;
    document.querySelectorAll(".veg-choice button").forEach((b) =>
      b.addEventListener("click", () => {
        document.querySelectorAll(".veg-choice button").forEach((x) => x.classList.remove("active"));
        b.classList.add("active");
        vegChoice = b.dataset.veg === "true";
      }));

    function renderGrid() {
      const dishes = MENU.filter((m) => !m.isCombo);
      const nCats = new Set(dishes.map((m) => m.category)).size;
      document.getElementById("view").innerHTML = `
        <div class="view-head">
          <p>${dishes.length} items across ${nCats} categories · ${COMBOS.length} combo${COMBOS.length === 1 ? "" : "s"}</p>
          <div class="actions">
            <button class="btn btn-ghost" id="addComboBtn">+ Add combo</button>
            <button class="btn" id="addBtn">+ Add menu item</button>
          </div>
        </div>
        ${COMBOS.length ? `<div class="panel card" style="margin-bottom:20px">
          <div class="panel-head"><h3>Combos &amp; bundles</h3><span class="link">Shown to customers with a COMBO badge</span></div>
          <div class="menu-grid">${COMBOS.map(comboCardHTML).join("")}</div>
        </div>` : ""}
        <div class="menu-grid">${dishes.map(cardHTML).join("")}</div>`;
      document.getElementById("addBtn").addEventListener("click", () => openModal(null));
      document.getElementById("addComboBtn").addEventListener("click", openComboModal);
      bind();
    }

    /* A combo bundles existing dishes at a set price. Its own card shows what
       it contains and what the customer saves versus ordering separately. */
    function comboCardHTML(c) {
      const parts = c.items.map((p) => {
        const dish = MENU.find((m) => m.id === p.id);
        return dish ? `${p.qty}× ${dish.name}` : null;
      }).filter(Boolean);
      const apart = c.items.reduce((s, p) => {
        const dish = MENU.find((m) => m.id === p.id);
        return s + (dish ? dish.price * p.qty : 0);
      }, 0);
      const saves = Math.max(0, apart - c.price);
      return `<div class="card menu-card">
        <img class="mc-img" src="${c.image}" alt="${c.name}" onerror="App.imgFallback(this)" />
        <div class="mc-body">
          <div class="mc-meta">
            <span class="mc-cat">Combo</span>
            ${saves ? `<span class="mc-stock">Saves ${App.money(saves)}</span>` : ""}
          </div>
          <h4>${c.name}</h4>
          <p>${parts.join(" + ") || "No dishes linked"}</p>
          <div class="mc-foot">
            <b>${App.money(c.price)}</b>
            <a class="mc-edit" href="#" data-delcombo="${c.id}" style="color:var(--danger)">${App.icon("minus",14)} Delete</a>
          </div>
        </div>
      </div>`;
    }

    function cardHTML(m) {
      const low = m.stock <= 10;
      return `<div class="card menu-card">
        <img class="mc-img" src="${m.image}" alt="${m.name}" onerror="App.imgFallback(this)" />
        <div class="mc-body">
          <div class="mc-meta">
            <span class="mc-cat">${catName(m.category)}</span>
            <span class="mc-stock ${low ? "low" : ""}">${m.stock} in stock</span>
          </div>
          <h4>${m.name}</h4>
          <p>${m.description || ""}</p>
          <div class="mc-foot">
            <b>${App.money(m.price)}</b>
            <div style="display:flex;gap:14px;align-items:center">
              <a class="mc-edit" href="#" data-edit="${m.id}">${App.icon("dashboard",14)} Edit</a>
              <a class="mc-edit" href="#" data-del="${m.id}" style="color:var(--danger)">${App.icon("minus",14)} Delete</a>
            </div>
          </div>
        </div>
      </div>`;
    }

    function bind() {
      document.querySelectorAll("[data-delcombo]").forEach((b) => b.addEventListener("click", async (e) => {
        e.preventDefault();
        const c = COMBOS.find((x) => x.id === b.dataset.delcombo);
        if (!confirm(`Delete the "${c.name}" combo?`)) return;
        await Api.deleteCombo(c.id);
        COMBOS = COMBOS.filter((x) => x.id !== c.id);
        MENU = MENU.filter((m) => m.id !== c.id);
        App.toast("Combo deleted"); renderGrid();
      }));
      document.querySelectorAll("[data-edit]").forEach((b) => b.addEventListener("click", (e) => { e.preventDefault(); openModal(b.dataset.edit); }));
      document.querySelectorAll("[data-del]").forEach((b) => b.addEventListener("click", async (e) => {
        e.preventDefault();
        const item = MENU.find((m) => m.id === b.dataset.del);
        if (confirm(`Delete "${item.name}" from the menu?`)) {
          await Api.deleteMenuItem(b.dataset.del);
          MENU = MENU.filter((m) => m.id !== item.id);
          App.toast("Dish deleted"); renderGrid();
        }
      }));
    }

    const modal = document.getElementById("modalBack");
    const dishPreview = document.getElementById("dishPreview");
    let pendingDishImage = null; // data URL staged for upload, or null = use the URL field as-is

    function renderDishPreview(url) {
      dishPreview.innerHTML = url ? `<img src="${url}" alt="preview" onerror="App.imgFallback(this)"/>` : App.icon("cutlery", 22);
    }
    document.getElementById("dishImageInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 1.5 * 1024 * 1024) { App.toast("Please use an image under 1.5 MB"); return; }
      const reader = new FileReader();
      reader.onload = () => {
        pendingDishImage = reader.result;
        document.getElementById("f-image").value = "";
        renderDishPreview(pendingDishImage);
      };
      reader.readAsDataURL(file);
    });
    document.getElementById("f-image").addEventListener("input", (e) => {
      pendingDishImage = null; // typing a URL overrides any staged upload
      renderDishPreview(e.target.value.trim());
    });

    function openModal(id) {
      const m = id ? MENU.find((x) => x.id === id) : null;
      document.getElementById("modalTitle").textContent = m ? "Edit dish" : "Add dish";
      document.getElementById("f-id").value = m ? m.id : "";
      document.getElementById("f-name").value = m ? m.name : "";
      document.getElementById("f-desc").value = m ? (m.description || "") : "";
      document.getElementById("f-price").value = m ? m.price : "";
      document.getElementById("f-stock").value = m ? m.stock : "";
      document.getElementById("f-cat").value = m ? m.category : (CATS[0] && CATS[0].slug);
      document.getElementById("f-rating").value = m ? (m.rating || 4.5) : 4.5;
      document.getElementById("f-image").value = m ? (m.image || "") : "";
      pendingDishImage = null;
      renderDishPreview(m ? m.image : "");
      vegChoice = m ? !!m.veg : true;
      document.querySelectorAll(".veg-choice button").forEach((x) => x.classList.toggle("active", (x.dataset.veg === "true") === vegChoice));
      modal.classList.add("open");
    }
    function closeModal() { modal.classList.remove("open"); }
    document.getElementById("cancelBtn").addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => { if (e.target === modal) closeModal(); });

    /* ---------- Combos ---------- */
    const comboBack = document.getElementById("comboBack");
    const comboQty = {};   // menu item id -> qty chosen for the combo being built

    function renderComboPicker() {
      const dishes = MENU.filter((m) => !m.isCombo);
      document.getElementById("comboPicker").innerHTML = dishes.map((m) => `
        <label style="display:flex;align-items:center;gap:10px;padding:8px 8px;border-radius:9px;cursor:pointer">
          <input type="checkbox" data-cpick="${m.id}" ${comboQty[m.id] ? "checked" : ""} style="width:16px;height:16px">
          <span style="flex:1;font-size:13.5px">${m.name}<small style="color:var(--muted)"> · ${App.money(m.price)}</small></span>
          <input type="number" min="1" value="${comboQty[m.id] || 1}" data-cqty="${m.id}"
                 style="width:58px;padding:5px 7px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:13px">
        </label>`).join("") || `<p class="settings-hint" style="padding:10px">Add some dishes first, then bundle them into a combo.</p>`;

      document.querySelectorAll("[data-cpick]").forEach((cb) => cb.addEventListener("change", () => {
        const id = cb.dataset.cpick;
        if (cb.checked) comboQty[id] = Number(document.querySelector(`[data-cqty="${id}"]`).value) || 1;
        else delete comboQty[id];
        updateComboSummary();
      }));
      document.querySelectorAll("[data-cqty]").forEach((inp) => inp.addEventListener("input", () => {
        const id = inp.dataset.cqty;
        if (comboQty[id]) { comboQty[id] = Number(inp.value) || 1; updateComboSummary(); }
      }));
      updateComboSummary();
    }

    function updateComboSummary() {
      const apart = Object.entries(comboQty).reduce((s, [id, qty]) => {
        const m = MENU.find((x) => x.id === id);
        return s + (m ? m.price * qty : 0);
      }, 0);
      const price = Number(document.getElementById("c-price").value) || 0;
      const el = document.getElementById("comboSummary");
      if (!apart) { el.textContent = "Pick at least one dish."; return; }
      const saves = apart - price;
      el.innerHTML = `Bought separately: <b>${App.money(apart)}</b>` +
        (price ? ` · Customer ${saves >= 0 ? "saves" : "pays extra"} <b style="color:${saves >= 0 ? "var(--green-700)" : "var(--danger)"}">${App.money(Math.abs(saves))}</b>` : "");
    }

    function openComboModal() {
      Object.keys(comboQty).forEach((k) => delete comboQty[k]);
      document.getElementById("c-name").value = "";
      document.getElementById("c-price").value = "";
      document.getElementById("c-image").value = "";
      document.getElementById("c-cat").innerHTML = CATS.map((c) => `<option value="${c.slug}">${c.name}</option>`).join("");
      renderComboPicker();
      comboBack.classList.add("open");
    }
    document.getElementById("comboCancel").addEventListener("click", () => comboBack.classList.remove("open"));
    comboBack.addEventListener("click", (e) => { if (e.target === comboBack) comboBack.classList.remove("open"); });
    document.getElementById("c-price").addEventListener("input", updateComboSummary);

    document.getElementById("comboForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const items = Object.entries(comboQty).map(([id, qty]) => ({ id, qty }));
      if (!items.length) { App.toast("Pick at least one dish for the combo"); return; }
      try {
        await Api.saveCombo({
          name: document.getElementById("c-name").value.trim(),
          price: Number(document.getElementById("c-price").value),
          category: document.getElementById("c-cat").value,
          image: document.getElementById("c-image").value.trim() || PLACEHOLDER,
          items,
        });
        [MENU, COMBOS] = await Promise.all([Api.getMenu(), Api.getCombos()]);
        App.toast("Combo added");
        comboBack.classList.remove("open");
        renderGrid();
      } catch (ex) { App.toast(ex.message); }
    });

    const PLACEHOLDER = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?auto=format&fit=crop&w=600&q=70";
    document.getElementById("itemForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = e.target.querySelector('button[type="submit"]');
      const id = document.getElementById("f-id").value || undefined;

      let image = document.getElementById("f-image").value.trim();
      if (pendingDishImage) {
        submitBtn.disabled = true; submitBtn.textContent = "Uploading photo…";
        try {
          const res = await Api.uploadImage(pendingDishImage, "menu");
          image = res.url;
        } catch (ex) {
          if (ex.message === "R2_NOT_CONFIGURED") image = pendingDishImage; // local dev fallback
          else { App.toast(ex.message || "Photo upload failed"); submitBtn.disabled = false; submitBtn.textContent = "Save dish"; return; }
        }
        submitBtn.textContent = "Save dish";
      }

      const item = {
        id,
        name: document.getElementById("f-name").value.trim(),
        description: document.getElementById("f-desc").value.trim(),
        price: Number(document.getElementById("f-price").value),
        stock: Number(document.getElementById("f-stock").value),
        category: document.getElementById("f-cat").value,
        rating: Number(document.getElementById("f-rating").value) || 4.5,
        image: image || PLACEHOLDER,
        veg: vegChoice,
      };
      if (!item.name) { App.toast("Name is required"); submitBtn.disabled = false; return; }
      try {
        const res = await Api.saveMenuItem(item);
        if (id) { const idx = MENU.findIndex((m) => m.id === id); MENU[idx] = { ...MENU[idx], ...item }; }
        else MENU.push({ ...item, id: res.id });
        App.toast(id ? "Dish updated" : "Dish added");
        closeModal();
        renderGrid();
      } catch (ex) { App.toast(ex.message); }
      submitBtn.disabled = false;
    });

    async function main() {
      const authData = await Api.requireAuth(["owner", "manager"]);
      if (!authData) return;
      App.mountSidebar("sidebar", "menu");
      App.mountMobileNav("mobileNav", "menu");
      App.mountTopbar("topbar", "Menu", async () => { [CATS, MENU, COMBOS] = await Promise.all([Api.getCategories(), Api.getMenu(), Api.getCombos()]); renderGrid(); App.toast("Refreshed"); });
      try {
        [CATS, MENU, COMBOS] = await Promise.all([Api.getCategories(), Api.getMenu(), Api.getCombos()]);
      } catch (e) {
        // Without this the page sits on "Loading…" forever whenever any one
        // of these calls fails, with no clue as to why.
        document.getElementById("view").innerHTML =
          `<div class="empty">${App.icon("alert",40)}<h3>Couldn't load the menu</h3><p>${e.message}</p>
           <button class="btn" style="margin-top:16px" onclick="location.reload()">Try again</button></div>`;
        return;
      }
      document.getElementById("f-cat").innerHTML = CATS.map((c) => `<option value="${c.slug}">${c.name}</option>`).join("");
      renderGrid();
    }
    main();
  </script>
</body>
</html>
