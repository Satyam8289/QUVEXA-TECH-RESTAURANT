<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Menu — The Food House</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230f5132'/%3E%3Cpath d='M4 18c8 2 15-4 15-13 0 0-13-3-15 8' fill='%23fff'/%3E%3C/svg%3E" />
</head>
<body class="customer">
  <div class="phone">
    <div id="brand"></div>
    <div id="closedBanner"></div>

    <div class="searchbar">
      <span id="searchIco"></span>
      <input id="search" type="search" placeholder="Search dishes, e.g. biryani, paneer…" autocomplete="off" />
    </div>

    <div class="filters" id="filters"></div>

    <div class="veg-toggle">
      <span>Pure veg only</span>
      <label class="switch"><input type="checkbox" id="vegOnly" /><span class="slider"></span></label>
    </div>

    <div class="menu-list" id="menuList"></div>
  </div>

  <div class="cartbar hidden" id="cartbar">
    <a class="cartbar-inner" href="cart.html">
      <div>
        <span class="count" id="cartCount">0 items</span><br>
        <strong id="cartTotal">₹0</strong>
      </div>
      <span class="go">View Cart <span id="goIco"></span></span>
    </a>
  </div>

  <!-- Order-type overlay: covers the menu until the customer picks how
       they're ordering, the way a McDonald's kiosk opens with Eat-in/Take-out -->
  <div class="ot-overlay" id="otOverlay">
    <div class="ot-inner">
      <span class="ot-mark" id="otMark"></span>
      <h2>How are you ordering?</h2>
      <p>Tap one to start your order</p>
      <div class="ot-grid">
        <button type="button" class="ot-box ot-dine" data-type="dine-in">
          <span class="ot-badge">
            <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 3v6a2.5 2.5 0 0 0 5 0V3M9.5 11v10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M17.5 3c-1.3 1-1.9 2.9-1.9 5 0 1.4.8 2.3 1.9 2.5V21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
          <b>Dine In</b>
          <span class="ot-rule"><i></i><span>◆</span><i></i></span>
          <small id="otDineSub">Served at your table</small>

          <svg class="ot-art" viewBox="0 0 200 132" aria-hidden="true">
            <ellipse cx="100" cy="122" rx="82" ry="8" fill="#0f5132" opacity=".06"/>
            <!-- left chair: upholstered back, seat, brass legs -->
            <path d="M30 60c0-7 5-11 12-11s12 4 12 11v22H30Z" fill="#125a37"/>
            <rect x="27" y="79" width="30" height="9" rx="4.5" fill="#0f5132"/>
            <path d="M31 88l-4 26M53 88l4 26" stroke="#c9a24a" stroke-width="3" stroke-linecap="round"/>
            <!-- right chair -->
            <path d="M146 60c0-7 5-11 12-11s12 4 12 11v22h-24Z" fill="#125a37"/>
            <rect x="143" y="79" width="30" height="9" rx="4.5" fill="#0f5132"/>
            <path d="M147 88l-4 26M169 88l4 26" stroke="#c9a24a" stroke-width="3" stroke-linecap="round"/>
            <!-- round marble table -->
            <ellipse cx="100" cy="72" rx="46" ry="12" fill="#fff" stroke="#dfe6e0" stroke-width="1.5"/>
            <path d="M54 72c0 6.6 20.6 12 46 12s46-5.4 46-12v5c0 6.6-20.6 12-46 12s-46-5.4-46-12Z" fill="#eef1ec"/>
            <rect x="90" y="84" width="20" height="28" rx="3" fill="#12482f"/>
            <ellipse cx="100" cy="114" rx="24" ry="6" fill="#c9a24a"/>
            <!-- plate stack -->
            <ellipse cx="72" cy="70" rx="15" ry="4.4" fill="#fff" stroke="#d7ddd6" stroke-width="1.3"/>
            <ellipse cx="72" cy="67" rx="12" ry="3.4" fill="#fff" stroke="#d7ddd6" stroke-width="1.3"/>
            <!-- brass vase with leaves -->
            <path d="M96 66h9l-1.6 -12h-5.8Z" fill="#c9a24a"/>
            <path d="M100.5 54c0-9 4-14 9-16-1 7-4 12-9 16Zm0 0c0-7-3.5-11-8-13 1 6 3.5 10 8 13Z" fill="#3f8f5c"/>
            <path d="M100.5 54V40" stroke="#3f8f5c" stroke-width="1.6" stroke-linecap="round"/>
            <!-- glass -->
            <path d="M118 56h11l-1.4 13.5h-8.2Z" fill="#bcd9c8" opacity=".85" stroke="#8fbfa4" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>

          <span class="ot-go"></span>
        </button>

        <button type="button" class="ot-box ot-take" data-type="takeaway" id="otTakeaway">
          <span class="ot-badge">
            <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5.5 8h13l-1 12.5a1.6 1.6 0 0 1-1.6 1.5H8.1a1.6 1.6 0 0 1-1.6-1.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
              <path d="M8.6 8V6a3.4 3.4 0 0 1 6.8 0v2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M10 13l4 4M14 13l-4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </span>
          <b>Takeaway /<br>Car Service</b>
          <span class="ot-rule"><i></i><span>◆</span><i></i></span>
          <small id="otTakeawaySub">Brought out to your car</small>

          <svg class="ot-art" viewBox="0 0 200 132" aria-hidden="true">
            <ellipse cx="100" cy="120" rx="80" ry="8" fill="#7c2d12" opacity=".07"/>
            <!-- kraft bag riding on the roof -->
            <path d="M84 30h32l-2.5 26H86.5Z" fill="#e8d6bd" stroke="#c9a887" stroke-width="1.6" stroke-linejoin="round"/>
            <path d="M92 30v-4a8 8 0 0 1 16 0v4" fill="none" stroke="#c9a887" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M96 38v9M104 38v9M96 42.5h8" stroke="var(--orange-600)" stroke-width="2" stroke-linecap="round"/>
            <!-- car body -->
            <path d="M26 96V78c0-4 3-7 7-7h9l12-14c2-2.4 4.6-3.6 7.6-3.6h47c3.6 0 6.6 1.6 8.8 4.4l10 13.2h13c4 0 7 3 7 7v18Z"
                  fill="var(--orange)" stroke="#b34a06" stroke-width="2"/>
            <!-- windows -->
            <path d="M60 71l9.5-11c1.2-1.4 2.6-2 4.4-2H92v13Z" fill="#cfe6d8" opacity=".9"/>
            <path d="M99 58h20c2 0 3.6.8 5 2.4L132 71H99Z" fill="#cfe6d8" opacity=".9"/>
            <!-- trim + lights -->
            <rect x="26" y="80" width="12" height="6" rx="3" fill="#fff"/>
            <rect x="158" y="80" width="12" height="6" rx="3" fill="#fff8f2"/>
            <rect x="70" y="82" width="58" height="3" rx="1.5" fill="#b34a06" opacity=".35"/>
            <!-- number plate -->
            <rect x="30" y="88" width="22" height="8" rx="2" fill="#fff" stroke="#d9d2c8" stroke-width="1"/>
            <!-- wheels with alloys -->
            <circle cx="62" cy="96" r="15" fill="#23282a"/>
            <circle cx="62" cy="96" r="7" fill="#cdd5d0"/>
            <circle cx="62" cy="96" r="2.6" fill="#8b9691"/>
            <circle cx="140" cy="96" r="15" fill="#23282a"/>
            <circle cx="140" cy="96" r="7" fill="#cdd5d0"/>
            <circle cx="140" cy="96" r="2.6" fill="#8b9691"/>
          </svg>

          <span class="ot-go"></span>
        </button>
      </div>
    </div>
  </div>

  <!-- Customer identity gate: asked once, before the first item is added -->
  <div class="modal-back" id="gateBack" style="position:fixed;inset:0;background:rgba(12,30,20,.5);backdrop-filter:blur(3px);z-index:70;display:none;align-items:center;justify-content:center;padding:20px">
    <form class="card" id="gateForm" style="width:100%;max-width:400px;padding:26px 24px">
      <h3 style="font-family:var(--serif);font-size:20px;margin-bottom:6px">Just before you order…</h3>
      <p style="color:var(--muted);font-size:13.5px;margin-bottom:18px">We'll use this to confirm your order and let you look up your order history any time.</p>
      <div class="field"><label for="gateName">Your name</label><input class="input" id="gateName" required placeholder="e.g. Ananya" /></div>
      <div class="field" style="margin-bottom:0"><label for="gatePhone">Phone number</label><input class="input" id="gatePhone" required type="tel" inputmode="tel" placeholder="+91 98765 43210" /></div>
      <button class="btn btn-block btn-lg" type="submit" style="margin-top:18px">Continue to Cart</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById("searchIco").innerHTML = App.icon("search", 18);
    document.getElementById("goIco").innerHTML = App.icon("back", 16);
    document.querySelector("#goIco svg").style.transform = "rotate(180deg)";

    let CATEGORIES = [], MENU = [], STORE_CLOSED = false;
    let activeCat = "all";
    let query = "";
    let vegOnly = false;

    // Filters
    const filtersEl = document.getElementById("filters");
    function renderFilters() {
      const cats = [{ id: "all", name: "All" }, ...CATEGORIES.map(c => ({ id: c.slug, name: c.name }))];
      filtersEl.innerHTML = cats.map(c =>
        `<button class="pill ${activeCat === c.id ? "active" : ""}" data-cat="${c.id}">${c.name}</button>`
      ).join("");
      filtersEl.querySelectorAll(".pill").forEach(p =>
        p.addEventListener("click", () => { activeCat = p.dataset.cat; renderFilters(); renderMenu(); })
      );
    }

    function renderMenu() {
      const list = MENU.filter(m => {
        if (activeCat !== "all" && m.category !== activeCat) return false;
        if (vegOnly && !m.veg) return false;
        if (query && !(`${m.name} ${m.description}`.toLowerCase().includes(query))) return false;
        return true;
      });
      const el = document.getElementById("menuList");
      if (!list.length) {
        el.innerHTML = `<div class="empty">${App.icon("search",40)}<h3>No dishes found</h3><p>Try another search or category.</p></div>`;
        return;
      }
      el.innerHTML = list.map(cardHTML).join("");
      bindCards();
    }

    function cardHTML(m) {
      const qty = Cart.qtyOf(m.id);
      const soldout = m.stock <= 0;
      const control = STORE_CLOSED
        ? `<span class="stock-low">Closed</span>`
        : soldout
        ? `<span class="stock-low">Sold out</span>`
        : qty > 0
          ? `<div class="stepper" data-id="${m.id}">
               <button data-act="dec">${App.icon("minus",16)}</button><b>${qty}</b>
               <button data-act="inc">${App.icon("plus",16)}</button></div>`
          : `<button class="add-btn" data-add="${m.id}">${App.icon("plus",15)} Add</button>`;
      return `
      <div class="dish card ${soldout ? "soldout" : ""}">
        <img class="dish-img" src="${m.image}" alt="${m.name}" loading="lazy" onerror="App.imgFallback(this)" />
        <div class="dish-body">
          <div class="dish-top">
            <span class="veg-dot ${m.veg ? "veg" : "nonveg"}"></span>
            <span class="dish-name">${m.name}</span>
            ${m.isCombo ? `<span class="combo-tag">COMBO</span>` : ""}
            <span class="dish-rating">${App.icon("star",13)} ${m.rating}</span>
          </div>
          <p class="dish-desc">${m.description}</p>
          <div class="dish-foot">
            <span class="price">${App.money(m.price)} ${m.stock > 0 && m.stock <= 10 ? `<small>· only ${m.stock} left</small>` : ""}</span>
            ${control}
          </div>
        </div>
      </div>`;
    }

    /* ---- Identity gate: first "Add" ever asks for name + phone, then
       proceeds straight to the cart (as requested). After that, adding
       more items just adds silently — no repeat interruptions. ---- */
    const gateBack = document.getElementById("gateBack");
    let pendingAddId = null;
    function openGate(itemId) {
      pendingAddId = itemId;
      const known = App.getCustomer();
      if (known) { document.getElementById("gateName").value = known.name; document.getElementById("gatePhone").value = known.phone; }
      gateBack.style.display = "flex";
    }
    document.getElementById("gateForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("gateName").value.trim();
      const phone = document.getElementById("gatePhone").value.trim();
      if (!name || phone.replace(/\D/g, "").length < 6) { App.toast("Enter your name and a valid phone number"); return; }
      App.setCustomer({ name, phone });
      gateBack.style.display = "none";
      if (pendingAddId) { Cart.add(pendingAddId); pendingAddId = null; }
      location.href = "cart.html";
    });
    gateBack.addEventListener("click", (e) => { if (e.target === gateBack) gateBack.style.display = "none"; });

    function bindCards() {
      document.querySelectorAll("[data-add]").forEach(b =>
        b.addEventListener("click", () => {
          if (STORE_CLOSED) { App.toast("This restaurant is currently closed for new orders"); return; }
          if (!App.getCustomer()) { openGate(b.dataset.add); return; }
          Cart.add(b.dataset.add); App.toast("Added to cart"); renderMenu();
        }));
      document.querySelectorAll(".stepper").forEach(s => {
        const id = s.dataset.id;
        s.querySelector('[data-act="inc"]').addEventListener("click", () => { Cart.setQty(id, Cart.qtyOf(id) + 1); renderMenu(); });
        s.querySelector('[data-act="dec"]').addEventListener("click", () => { Cart.setQty(id, Cart.qtyOf(id) - 1); renderMenu(); });
      });
    }

    function renderCartBar() {
      const bar = document.getElementById("cartbar");
      const c = Cart.count();
      if (c > 0) {
        bar.classList.remove("hidden");
        document.getElementById("cartCount").textContent = `${c} item${c > 1 ? "s" : ""}`;
        document.getElementById("cartTotal").textContent = App.money(Cart.subtotal());
      } else bar.classList.add("hidden");
    }

    document.getElementById("search").addEventListener("input", e => { query = e.target.value.toLowerCase().trim(); renderMenu(); });
    document.getElementById("vegOnly").addEventListener("change", e => { vegOnly = e.target.checked; renderMenu(); });
    document.addEventListener("cart:change", renderCartBar);

    /* Kiosk-style order-type overlay. Shown once per visit (js/app.js clears
       the choice whenever the customer lands on index.html again), covering
       the menu until they pick — a table QR pins WHICH table they're at, but
       not HOW they're ordering, since someone seated may still want a parcel. */
    function showOrderTypeOverlay(tenant) {
      if (App.getOrderType()) return;              // already chosen this visit
      const overlay = document.getElementById("otOverlay");
      document.getElementById("otMark").innerHTML = App.brandMark(54);
      overlay.querySelectorAll(".ot-go").forEach((g) => { g.innerHTML = App.icon("back", 18); });

      const tableNo = App.getTableNo();
      if (App.isTableLocked() && tableNo) document.getElementById("otDineSub").textContent = `Served at table ${tableNo}`;

      // Takeaway is prepaid, so it's only offered once the restaurant has
      // connected Razorpay — otherwise there's no way to pay for it.
      const canPrepay = !!tenant.razorpayEnabled;
      if (!canPrepay) {
        document.getElementById("otTakeaway").classList.add("disabled");
        document.getElementById("otTakeawaySub").textContent = "Not available here yet";
      }

      overlay.classList.add("open");
      overlay.querySelectorAll("[data-type]").forEach((box) => box.addEventListener("click", () => {
        const type = box.dataset.type;
        if (type !== "dine-in" && !canPrepay) { App.toast("This restaurant isn't taking these orders yet"); return; }
        if (type === "dine-in" && !tableNo) {
          // No table known and no QR scanned — they have to say which table.
          const t = (prompt("Which table are you at?") || "").trim();
          if (!t) return;
          App.setTableNo(t);
        }
        App.setOrderType(type);
        overlay.classList.remove("open");
      }));
    }

    async function main() {
      try {
        const data = await Api.loadPublic();
        CATEGORIES = data.categories;
        MENU = data.menu;
        STORE_CLOSED = !!data.tenant.isClosed;
        document.getElementById("brand").innerHTML = App.brandBar({ back: "index.html", subtitle: "Our Menu" });
        if (STORE_CLOSED) {
          document.getElementById("closedBanner").innerHTML = `
            <div class="section" style="padding-bottom:0">
              <div class="card" style="padding:16px;display:flex;align-items:center;gap:12px;background:#fff8ec;border-color:#fbe4bd">
                <span style="color:#b45309">${App.icon("lock",22)}</span>
                <div><b style="font-size:13.5px">This restaurant is currently closed</b><br>
                <small style="color:var(--muted)">You can browse the menu, but new orders can't be placed right now. You can still view your <a href="orders.html" style="color:var(--green-700);font-weight:600">past orders</a>.</small></div>
              </div>
            </div>`;
        }
        renderFilters();
        renderMenu();
        renderCartBar();
        App.mountBottomNav("menu");
        showOrderTypeOverlay(data.tenant);
      } catch (e) {
        document.getElementById("menuList").innerHTML =
          `<div class="empty">${App.icon("alert",40)}<h3>Can't load the menu</h3><p>Please check your connection and try again.</p></div>`;
      }
    }
    main();
  </script>
</body>
</html>
